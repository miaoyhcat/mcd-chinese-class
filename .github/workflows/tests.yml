name: tests

# 只跑不需要网络的检查：语法、模板、课文生成、网页构建、静态合规规则。
# 浏览器端测试按环境可用性执行，起不来就 SKIP —— 不伪造通过。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python 检查与测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: |
          python -m py_compile mcd_chinese.py mcd_mcp.py build_web.py
          python -m py_compile tests/test_mcd_chinese.py
          echo "语法检查通过"

      - name: 运行测试套件
        # 联网比对参赛声明那一条在没有 gh 的环境会报 SKIP，不计入通过
        run: python tests/test_mcd_chinese.py

      - name: 确认演示页与构建产物一致
        run: |
          python build_web.py
          if ! git diff --quiet -- docs/index.html; then
            echo "::error::docs/index.html 与 web/template.html 不同步，请重跑 build_web.py 并提交"
            git diff --stat -- docs/index.html
            exit 1
          fi
          echo "构建产物一致"

  build-matrix:
    name: 跨平台构建（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成课文（三种输出格式）
        # 注意：这三个命令都不需要任何 API Key
        run: |
          python mcd_chinese.py --demo --json > /dev/null
          python mcd_chinese.py --demo --md > /dev/null
          python mcd_chinese.py --items "巨无霸,中薯条,可乐" > /dev/null
          python mcd_chinese.py --list > /dev/null
        shell: bash

      - name: 构建网页
        run: python build_web.py

      - name: 静态规则检查
        run: python tests/check_static.py

  browser:
    name: 浏览器端测试
    runs-on: ubuntu-latest
    # 不设 continue-on-error：测试「失败」必须让 CI 变红。
    # 环境不具备时脚本自己返回 2，下面那一步会转成 warning 而不是错误。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: python build_web.py

      - name: 安装测试依赖
        run: npm install --no-audit --no-fund || echo "依赖装不上，后面会 SKIP"

      - name: 安装 chromium
        run: npx playwright install chromium --with-deps || echo "浏览器装不上，后面会 SKIP"

      - name: 网页测试
        # 退出码 2 表示 SKIP（环境不具备），转成 warning；
        # 退出码 1 表示真的失败，必须让构建红掉。
        run: |
          set +e
          node tests/test_web.js
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::浏览器测试被跳过（环境不具备），这不等于通过"
            exit 0
          fi
          exit $code

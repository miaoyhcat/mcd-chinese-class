<script>
/* 课文模板由 lessons.json 生成，构建时内联进来（见 build_web.py） */
const LESSONS = [{"id": "beiying", "title": "背影", "author": "朱自清", "tag": "写人记事 · 深情", "opening": "我与那{main}不相见已二年余了，我最不能忘记的是它的背影。", "body": ["那年秋天，祖母死了，父亲的差使也交卸了，正是祸不单行的日子。我从北京到了徐州，打算跟着父亲奔丧回家。到南京时，父亲因为事忙，本已说定不送我，叫旅馆里一个熟识的茶房陪我同去。他再三嘱咐茶房，甚是仔细。但他终于不放心，怕茶房不妥帖；颇踌躇了一会。其实我那年已二十岁，北京已来往过两三次，是没有什么要紧的了。他踌躇了一会，终于决定还是自己送我去。", "我说道：“爸爸，你走吧。”他望车外看了看，说：“我买几个{main}去。你就在此地，不要走动。”", "我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到柜台边，慢慢探身下去，尚不大难。可是他穿过点餐的人群，要爬上那边月台，就不容易了。他用两手攀着上面，两脚再向上缩；他手里那袋{side}晃来晃去的样子，显出努力的样子。这时我看见他的背影，我的泪很快地流下来了。", "我赶紧拭干了泪。怕他看见，也怕别人看见。我再向外看时，他已抱了{main}往回走了。到这边时，我赶紧去搀他。他和我走到车上，将{main}一股脑儿放在我的皮大衣上。于是扑扑衣上的泥土，心里很轻松似的。", "过一会说：“我走了，到那边来信！”我望着他走出去。他走了几步，回过头看见我，说：“进去吧，里边没人。”等他的背影混入来来往往的人里，再找不着了，我便进来坐下，我的眼泪又来了。"], "ending": "我读到此处，在晶莹的泪光中，又看见那个热气腾腾的、{main}的背影。唉！我不知何时再能与他相见！", "questions": ["文中“我买几个{main}去”一句单独成段，有什么表达效果？", "作者描写父亲越过柜台、攀上月台的细节，用了哪些动词？这样写有什么好处？", "“我的泪很快地流下来了”与“我的眼泪又来了”，两处流泪的原因有何不同？", "本文题为《背影》，如果改成《{main}》，表达效果会有什么变化？"]}, {"id": "kongyiji", "title": "孔乙己", "author": "鲁迅", "tag": "小说 · 冷峻", "opening": "鲁镇的麦当劳的格局，是和别处不同的：都是当街一个曲尺形的大柜台，柜里面预备着热水，可以随时温{drink}。", "body": ["点餐的人，傍午傍晚散了工，每每花二十七块钱，买一个{main}——这是二十多年前的事，现在每个要涨到三十块——靠柜外站着，热热地吃了休息。", "我从十二岁起，便在镇口的麦当劳里当伙计。掌柜说，样子太傻，怕侍候不了主顾，就在柜台里做点事了。", "孔乙己是站着吃{main}而穿长衫的唯一的人。他身材很高大；青白脸色，皱纹间时常夹些伤痕；一部乱蓬蓬的花白的胡子。穿的虽然是长衫，可是又脏又破，似乎十多年没有补，也没有洗。", "孔乙己一到店，所有点餐的人便都看着他笑，有的叫道，“孔乙己，你脸上又添上新伤疤了！”他不回答，对柜里说，“要一个{main}，{items}。”便排出三十块钱。", "他们又故意的高声嚷道，“你一定又偷了人家的东西了！”孔乙己睁大眼睛说，“你怎么这样凭空污人清白……”", "“什么清白？我前天亲眼见你偷了隔壁的{side}，吊着打。”", "孔乙己便涨红了脸，额上的青筋条条绽出，争辩道，“窃{side}不能算偷……窃{side}！……读书人的事，能算偷么？”接连便是难懂的话，什么“君子固穷”，什么“者乎”之类，引得众人都哄笑起来：店内外充满了快活的空气。"], "ending": "我到现在终于没有见——大约孔乙己的确已经戒了。", "questions": ["“站着吃{main}而穿长衫”这一形象有什么典型意义？", "“窃{side}不能算偷”这句话反映了孔乙己怎样的性格？", "文中反复出现“店内外充满了快活的空气”，作者这样写的用意是什么？", "如果把结尾改成“孔乙己后来升职加薪了”，小说的主题会发生什么变化？"]}, {"id": "baicaoyuan", "title": "从百草园到三味书屋", "author": "鲁迅", "tag": "散文 · 童趣", "opening": "我家的后面有一个很大的园，相传叫作百草园。", "body": ["不必说金黄的{side}，松软的{main}，冰镇的{drink}，酥脆的鸡块；也不必说骑手在檐下长鸣，胖乎乎的食客伏在柜台旁，轻捷的叫天子忽然从草间直窜向云霄里去了。单是周围的短短的泥墙根一带，就有无限趣味。", "我于是常常在柜台边徘徊，翻开断砖来，有时会遇见蜈蚣；还有斑蝥，倘若用手指按住它的脊梁，便会啪的一声，从后窍喷出一阵烟雾。", "出门向东，不上半里，走过一道石桥，便是三味书屋了。从一扇黑油的竹门进去，第三间是书房。中间挂着一块扁道：三味书屋。", "先生读书入神的时候，于我们是很相宜的。有几个便用纸糊的盔甲套在指甲上做戏。我是画画儿，用一种叫作“荆川纸”的，蒙在小说的绣像上一个个描下来，像习字时候的影写一样。读的书多起来，画的画也多起来；书没有读成，画的成绩却不少了，最成片段的是《{main}》的绣像，都有一大本。"], "ending": "后来，因为要钱用，卖给一个有钱的同窗了。他的父亲是开锡箔店的；听说现在自己已经做了店主，而且快要升到绅士的地位了。这东西早已没有了罢。", "questions": ["“不必说……也不必说……单是……”这个句式在文中起什么作用？请仿写一句，对象限定为一家便利店。", "作者详写百草园、略写三味书屋，这样安排有什么好处？", "文中的“我”把菜单描成绣像，这一细节表现了什么？"]}, {"id": "guxiang", "title": "故乡", "author": "鲁迅", "tag": "小说 · 沉郁", "opening": "我冒了严寒，回到相隔二千余里、别了二十余年的故乡去。", "body": ["我冒了严寒，回到相隔二十分钟、别了三天的{store}去。", "时候既然是深冬；渐近故乡时，天气又阴晦了，冷风吹进船舱中，呜呜的响，从篷隙向外一望，苍黄的天底下，远近横着几个萧索的荒村，没有一些活气。我的心禁不住悲凉起来了。", "阿！这不是我二十年来时时记得的{store}？", "我所记得的{store}全不如此。我的{store}好得多了。但要我记起他的美丽，说出他的佳处来，却又没有影像，没有言辞了。仿佛也就如此。", "第二日清早晨我到了我家的门口了。瓦楞上许多枯草的断茎当风抖着，正在说明这老屋难免易主的原因。几房的本家大约已经搬走了，所以很寂静。", "这时候，我的脑里忽然闪出一幅神异的图画来：深蓝的天空中挂着一轮金黄的圆月，下面是海边的沙地，都种着一望无际的碧绿的{side}。其间有一个十一二岁的少年，项带银圈，手捏一柄钢叉，向一匹猹尽力的刺去，那猹却将身一扭，反从他的胯下逃走了。", "这少年便是闰土。"], "ending": "我想：希望是本无所谓有，无所谓无的。这正如地上的{side}；其实地上本没有{side}，点的人多了，也便成了{side}。", "questions": ["“相隔二十分钟、别了三天”与“二千余里、二十余年”并置，产生了怎样的效果？", "文中“这不是我二十年来时时记得的{store}”表达了怎样的情绪？", "结尾化用了哪一句原文？改动后是削弱了还是强化了原意？"]}, {"id": "yueyanglou", "title": "岳阳楼记", "author": "范仲淹", "tag": "文言 · 议论", "opening": "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。", "body": ["二零二六年秋，予谪守工位。越明年，需求不断，加班不休，乃重修点餐之术，刻唐贤今人诗赋于其上。属予作文以记之。", "予观夫麦门胜状，在一个“薯”字。衔山吞江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则{store}之大观也，前人之述备矣。", "然则北通{drink}，南极{main}，迁客骚人，多会于此，览物之情，得无异乎？", "若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。", "至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把{drink}临风，其喜洋洋者矣。", "嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先餐之饱而饱，后餐之饿而饿”乎。噫！微斯人，吾谁与归？"], "ending": "时二零二六年十月，记于工位。", "questions": ["“先餐之饱而饱，后餐之饿而饿”化用了哪一句名言？改动后产生了什么效果？", "本文写景部分大量使用四字短语，有什么表达效果？", "作者说“不以物喜，不以己悲”，又说“感极而悲”“其喜洋洋”，这两者矛盾吗？为什么？"]}, {"id": "hetang", "title": "荷塘月色", "author": "朱自清", "tag": "散文 · 抒情", "opening": "这几天心里颇不宁静。", "body": ["今晚在工位上坐着乘凉，忽然想起日日走过的{store}，在这满月的光里，总该另有一番样子吧。", "月亮渐渐地升高了，窗外马路上孩子们的欢笑，已经听不见了；妻在屋里拍着闰儿，迷迷糊糊地哼着眠歌。我悄悄地披了大衫，带上门出去。", "沿着{store}，是一条曲折的小煤屑路。这是一条幽僻的路；白天也少人走，夜晚更加寂寞。", "路上只我一个人，背着手踱着。这一片天地好像是我的；我也像超出了平常的自己，到了另一世界里。我爱热闹，也爱冷静；爱群居，也爱独处。像今晚上，一个人在这苍茫的月下，什么都可以想，什么都可以不想，便觉是个自由的人。", "于是想起{main}来了。曲曲折折的餐盘上面，弥望的是田田的{side}。{side}出水很高，像亭亭的舞女的裙。层层的{side}中间，零星地点缀着些白花，有袅娜地开着的，有羞涩地打着朵儿的；正如一粒粒的明珠，又如碧天里的星星，又如刚出浴的美人。", "月光如流水一般，静静地泻在这一片{side}上。薄薄的青雾浮起在餐盘里。{side}仿佛在牛乳中洗过一样；又像笼着轻纱的梦。", "这时候{side}与{main}也有一丝的颤动，像闪电般，霎时传过餐盘的那边去了。{side}本是肩并肩密密地挨着，这便宛然有了一道凝碧的波痕。"], "ending": "这样想着，猛一抬头，不觉已是自己的门前；轻轻地推门进去，什么声息也没有，妻已睡熟好久了。（桌上那盒{main}，也凉了好久了。）", "questions": ["“这几天心里颇不宁静”作为开篇，在全文中起什么作用？", "本文写景细腻，请分析“泻”“浮”“洗”三个动词的表达效果。", "结尾写“妻已睡熟好久了”，与“{main}也凉了好久了”并置，产生了怎样的意味？"]}, {"id": "shexi", "title": "社戏", "author": "鲁迅", "tag": "小说 · 怀旧", "opening": "我们鲁镇的习惯，本来是凡有出嫁的女儿，倘自己还未当家，夏间便大抵回到母家去消夏。", "body": ["就在我十一二岁时候的这一年，这日期也看看等到了。不料这一年真可惜，在早上就叫不到船。平桥村只有一只早出晚归的航船是大船，决没有留用的道理。其余的都是小船，不合用；央人到邻村去问，也没有，早都给别人定下了。", "和我一同玩的是许多小朋友，因为有了远客，他们也都从父母那里得了减少工作的许可，伴我来游戏。我们年纪都相仿，但论起行辈来，却至少是叔子，有几个还是太公。", "我的朋友说：“我们的大船不是回来了么？”", "于是架起两支橹，一支两人，一里一换，有说笑的，有嚷的，夹着潺潺的船头激水的声音，在左右都是碧绿的豆麦田地的河流中，飞一般径向{store}前进了。", "一出门，便望见{store}的灯火，仿佛一座仙山楼阁，满被红霞罩着了。", "最惹眼的是屹立在庄外临河的空地上的一座戏台，仿佛在画中一般。但那铁头老生却又并不翻筋斗，只有几个赤膊的人翻，翻了一阵，都进去了，接着走出一个小旦来，咿咿呀呀的唱。", "我有些疲倦了，托桂生买豆浆去。他去了一刻，回来说，“没有。卖豆浆的聋子也回去了。日里倒有，我还喝了两碗呢。现在去舀一瓢水来给你罢。”"], "ending": "真的，一直到现在，我实在再没有吃到那夜似的{side}，——也不再看到那夜似的好戏了。", "questions": ["结尾说“再没有吃到那夜似的{side}”，真的只是{side}好吃吗？", "文中写小伙伴们“一支两人，一里一换”地划船，这段描写有什么作用？", "“仿佛一座仙山楼阁，满被红霞罩着了”——作者为什么要把{store}写得这么美？"]}, {"id": "aq", "title": "阿Q正传", "author": "鲁迅", "tag": "小说 · 讽刺", "opening": "我要给阿Q做正传，已经不止一两年了。", "body": ["阿Q没有家，住在未庄的土谷祠里；也没有固定的职业，只给人家做短工，割麦便割麦，舂米便舂米，撑船便撑船。", "未庄的人又叫阿Q作“赛{main}”，因为他的脸上有几处不知起于何时的癫疮疤。他讳说“癞”以及一切近于“赖”的音，后来推而广之，“光”也讳，“亮”也讳，再后来，连“灯”“烛”都讳了。", "阿Q在形式上打败了，被人揪住黄辫子，在壁上碰了四五个响头，闲人这才心满意足的得胜的走了，阿Q站了一刻，心里想，“我总算被儿子打了，现在的世界真不像样……”于是也心满意足的得胜的走了。", "他要在{store}里买一个{main}。柜员说，要三十块。阿Q先前阔，见识高，而且真能做，本来几乎是一个“完人”了，他想了想，愤愤的吐一口唾沫：“我们先前——比你阔的多啦！你算是什么东西！”", "他付了钱，心里想：三十块一个{main}，在未庄是算便宜的；何况这{main}，是给儿子吃的。", "然而他又想：儿子吃了{main}，便是做老子的有面子。于是他心满意足的得胜的走了。"], "ending": "阿Q于是心满意足的得胜的走了。他觉得他是第一个能够自轻自贱的人，除了“自轻自贱”不算外，余下的就是“第一个”。状元不也是“第一个”么？“你算是什么东西”呢！", "questions": ["“精神胜利法”在文中是通过哪些具体细节表现的？", "如果阿Q今天去买{main}，发现又涨价了，他会怎么安慰自己？", "作者写阿Q“心满意足的得胜的走了”，这个“得胜”包含了怎样的讽刺？"]}, {"id": "fanjin", "title": "范进中举", "author": "吴敬梓", "tag": "小说 · 讽刺", "opening": "范进进学回家，母亲、妻子俱各欢喜。", "body": ["范进进学回家，母亲、妻子俱各欢喜。正待烧锅做饭，只见他丈人胡屠户，手里拿着一副大肠和一瓶酒，走了进来。", "胡屠户道：“我自倒运，把个女儿嫁与你这现世宝，历年以来，不知累了我多少。如今不知因我积了甚么德，带挈你中了个相公，我所以带个酒来贺你。”", "范进唯唯连声，叫浑家把肠子煮了，烫起酒来，在茅草棚下坐着。", "到出榜那日，家里没有米，母亲叫范进拿一只生蛋的母鸡到集上去卖。范进抱着鸡，手里插个草标，一步一踱的，东张西望，在那里寻人买。", "邻居道：“范相公，快些回去！你恭喜中了！你的{main}券到了！”", "范进不看便罢，看了一遍，又念一遍，自己把两手拍了一下，笑了一声，道：“噫！好了！我中了！”说着，往后一交跌倒，牙关咬紧，不省人事。", "老太太慌了，慌将几口开水灌了过来。他爬将起来，又拍着手大笑道：“噫！好！我中了！”笑着，不由分说，就往门外飞跑，把报录人和邻居都吓了一跳。走出大门不多路，一脚踹在塘里，挣起来，头发都跌散了，两手黄泥，淋淋漓漓一身的水。", "众人拉他不住，拍着笑着，一直走到集上去了。众人大眼望小眼，一齐道：“原来新贵人欢喜疯了。”"], "ending": "胡屠户凶神似的走到跟前，说道：“该死的畜生！你中了甚么？”一个嘴巴打将去。众人和邻居见这模样，忍不住的笑。", "questions": ["“噫！好了！我中了！”这句话为什么能成为经典？它写出了范进怎样的状态？", "胡屠户在范进中券前后态度截然不同，这反映了什么？", "如果把“中举”换成“抢到免单券”，这个故事的讽刺意味还在吗？"]}, {"id": "taohuayuan", "title": "桃花源记", "author": "陶渊明", "tag": "文言 · 记叙", "opening": "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。", "body": ["晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。", "林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。", "二零二六年秋，打工人点餐为业。刷手机，忘路之远近。忽逢一店，排队数百步，中无插队，柜员和善，出餐甚快。打工人甚异之，复前行，欲穷其队。", "队尽街角，便得一店，门有小口，仿佛若有光。便弃车，从口入。初极狭，才通人。复行数十步，豁然开朗。", "土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。", "见客人，乃大惊，问所从来。具答之。便要还家，设{main}{side}作食。村中闻有此人，咸来问讯。", "自云先世避涨价之乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何价，乃不知有涨，无论翻倍。", "此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出{side}。停数日，辞去。此中人语云：“不足为外人道也。”"], "ending": "南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。", "questions": ["“乃不知有汉，无论魏晋”在原文中表现什么？改成“乃不知有涨，无论翻倍”后，讽刺的对象变成了什么？", "桃花源中人说“不足为外人道也”，为什么？", "结尾写刘子骥“未果，寻病终”，这样安排有什么作用？"]}, {"id": "loushiming", "title": "陋室铭", "author": "刘禹锡", "tag": "文言 · 短章", "opening": "山不在高，有仙则名。水不在深，有龙则灵。", "body": ["山不在高，有仙则名。水不在深，有龙则灵。店不在大，有{side}则名。", "苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。", "可以调{drink}，阅菜单。无催促之乱耳，无排号之劳形。", "邻座有小儿啼哭，窗外有车马喧声。然坐此店中，心自安之。"], "ending": "南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？", "questions": ["“店不在大，有{side}则名”与原句“山不在高，有仙则名”是什么关系？这种仿写为什么好笑？", "结尾引用“孔子云：何陋之有？”有什么作用？", "本文只有八十余字，却写了景、人、事三个方面。请分别指出它们对应的句子。"]}, {"id": "ailianshuo", "title": "爱莲说", "author": "周敦颐", "tag": "文言 · 托物言志", "opening": "水陆草木之花，可爱者甚蕃。", "body": ["水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。", "予独爱{side}之出油锅而不染，濯酱料而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。", "予谓菊，花之隐逸者也；牡丹，花之富贵者也；{side}，花之君子者也。", "噫！菊之爱，陶后鲜有闻。{side}之爱，同予者何人？牡丹之爱，宜乎众矣！"], "ending": "同予者何人？——大约只有加班到十点的人吧。", "questions": ["“出油锅而不染”化用了哪一句？改动后产生了什么效果？", "作者说{side}是“花之君子者也”，这样写有什么意味？", "本文用菊和牡丹来衬托{side}，这种写法叫什么？有什么好处？"]}, {"id": "chushibiao", "title": "出师表", "author": "诸葛亮", "tag": "文言 · 表", "opening": "先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。", "body": ["先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。", "臣本学生，躬耕于工位，苟全性命于加班，不求闻达于食堂。老板不以臣懒惰，猥自枉屈，三顾臣于工位之中，咨臣以点餐之事，由是感激，遂许老板以驱驰。", "后值倾覆，受任于饿殍之际，奉命于午休之间，尔来二十有一分钟矣。", "今预算已定，胃口已足，当奖率三军，北定{main}，庶竭驽钝，攘除饥饿，兴复馋虫，还于工位。此臣所以报老板而忠陛下之职分也。", "至于斟酌损益，进尽忠言，则攸之、祎、允之任也。"], "ending": "今当远离，临表涕零，不知所言。", "questions": ["“臣本布衣，躬耕于南阳”改成“臣本学生，躬耕于工位”，表达效果发生了什么变化？", "本文反复提到“先帝”，这样写有什么作用？", "如果把“北定{main}”改回原文的“北定中原”，哪一版更有感染力？为什么？"]}, {"id": "chun", "title": "春", "author": "朱自清", "tag": "散文 · 抒情", "opening": "盼望着，盼望着，东风来了，春天的脚步近了。", "body": ["盼望着，盼望着，午休来了，午饭的脚步近了。", "一切都像刚睡醒的样子，欣欣然张开了眼。胃叫起来了，手抖起来了，{main}的香飘起来了。", "{side}偷偷地从油锅里钻出来，黄黄的，脆脆的。店子里，柜台边，瞧去，一大片一大片满是的。坐着，躺着，打两个滚，踢几脚球，赛几趟跑，捉几回迷藏。", "“吹面不寒杨柳风”，不错的，像母亲的手抚摸着你。风里带来些新翻的泥土的气息，混着青草味儿，还有各种{side}的香，都在微微润湿的空气里酝酿。", "天上风筝渐渐多了，地上孩子也多了。城里乡下，家家户户，老老小小，也赶趟儿似的，一个个都出来了。舒活舒活筋骨，抖擞抖擞精神，各做各的一份事去。"], "ending": "{main}像刚落地的娃娃，从头到脚都是新的，它生长着。\n{main}像小姑娘，花枝招展的，笑着，走着。\n{main}像健壮的青年，有铁一般的胳膊和腰脚，领着我们上前去。", "questions": ["本文结尾三个比喻句分别写出了春天的什么特点？换成{main}后，效果如何？", "“盼望着，盼望着”连用两次，有什么表达效果？", "作者写“{side}偷偷地从油锅里钻出来”，用了什么修辞？这样写有什么好处？"]}, {"id": "bianselong", "title": "变色龙", "author": "契诃夫", "tag": "外国小说 · 讽刺", "opening": "警官奥楚蔑洛夫穿着新的军大衣，提着小包，穿过市场的广场。", "body": ["店员小奥穿着崭新的制服，端着托盘，穿过点餐的人群。他身后跟着一个端盘子的伙计，手里托着一个盛满{side}的纸袋。", "忽然间，人群里传来一声嚷叫：“这到底是谁的{side}？谁把他家的{side}扔在这儿？”", "小奥微微探身向前，往人群里看。那个纸袋就摆在取餐台上，{side}撒了一地，过路的人正绕着它走。", "“这是谁干的？”小奥挤进人群，“我绝不放过这件事！我要给那些把东西乱扔的人一个教训！这准是那些不守规矩的顾客干的……我要罚他的款！”", "“长官，这好像是……”伙计开口说，“这好像是会员的订单，我刚才看见他拿着金卡。”", "“哦，是会员的？”小奥立刻换上笑脸，“那就另当别论了。会员的{side}，那是应该好好保管的，怎么能随便放在这儿。伙计，赶紧给人家收起来，再补一份新的。”", "“长官，可这好像又不是会员的，我看见是外卖小哥放在这儿的。”", "“外卖小哥？”小奥的脸又拉长了，“那更不像话！这些外卖的，一天到晚横冲直撞！这得记下来，报给平台。”", "“可这明明是……”", "“少废话！”小奥把身上的制服一裹，“我自有判断。”"], "ending": "小奥穿过人群，继续往前走。他把制服又裹了裹，因为天气还不算热。", "questions": ["小奥的态度一共变了几次？每次变化的依据是什么？", "如果{side}换成{main}，这个故事的讽刺效果会变强还是变弱？为什么？", "“他把制服又裹了裹，因为天气还不算热”——这个结尾有什么意味？"]}, {"id": "hezhou", "title": "核舟记", "author": "魏学洢", "tag": "文言 · 说明", "opening": "明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。", "body": ["今有奇巧人曰麦乐送，能以方寸之盒，为{main}、{side}、{drink}，以至酱料、餐巾、玩具，罔不因势象形，各具情态。", "盒上下长约八寸有奇，高可二掌许。中轩敞者为舱，{main}居之。", "旁开小格，左右各二，共四格。启格而观，酱料相望焉。", "闭之，则右印“趁热食用”，左印“如有问题请联系门店”，朱色注之。", "盒盖内侧稍平，则印字其上，文曰“保质期至”，细若蚊足，钩画了了，其色墨。", "又用鸡块一方，刻“{store}”二字，若为签记。", "通计一盒，为{main}一、{side}一、{drink}一、酱料二、餐巾一，为格四、为字共若干。而计其长曾不盈掌。盖简{side}之细者修狭者为之。"], "ending": "嘻，技亦灵怪矣哉！", "questions": ["本文用了大量数量词（“长约八寸有奇”“高可二掌许”），这样写有什么表达效果？", "作者反复强调盒子的“小”与内容的“多”，用意是什么？", "如果删去最后一句“嘻，技亦灵怪矣哉！”，文章的意味会有什么变化？"]}];
const FALLBACK = {"main": "巨无霸", "side": "薯条", "drink": "可乐", "store": "麦当劳"};

/* ── 与 mcd_chinese.py 保持一致的分类逻辑 ── */
const DRINK_WORDS = ["可乐","雪碧","芬达","咖啡","拿铁","美式","茶","奶茶","果汁","橙汁","豆浆","牛奶","水"];
// 注意别放「鸡腿」——「板烧鸡腿堡」「麦辣鸡腿堡」是汉堡，会被误判成小食
const SIDE_WORDS  = ["薯条","鸡块","鸡翅","派","沙拉","玉米","洋葱圈","冰淇淋","麦旋风","新地","圣代","蛋挞","水果"];
const MAIN_MARKERS = ["堡","卷","饭","粥"];
const SIZE_PREFIX = ["超大","大","中","小"];

const stripSize = s => { for (const p of SIZE_PREFIX)
  if (s.startsWith(p) && s.length > p.length + 1) return s.slice(p.length); return s; };

function classify(items){
  // 与 mcd_chinese.py 的 classify() 保持一致：三者互不重叠
  const drinks = items.filter(i => DRINK_WORDS.some(w => i.includes(w)));
  const mains = [], sides = [];
  for (const i of items){
    if (drinks.includes(i)) continue;
    if (MAIN_MARKERS.some(w => i.includes(w))) mains.push(i);
    else sides.push(i);
  }
  if (!mains.length){
    const first = items.find(i => !drinks.includes(i)) ?? items[0];
    mains.push(first);
    for (let k = sides.length - 1; k >= 0; k--) if (sides[k] === first) sides.splice(k, 1);
  }
  return {mains, sides, drinks};
}

function fields(items){
  const {mains, sides, drinks} = classify(items);
  const uniq = [...new Set(items)];
  return {
    main: mains[0],
    side: sides.length ? stripSize(sides[0]) : FALLBACK.side,
    drink: drinks.length ? stripSize(drinks[0]) : FALLBACK.drink,
    items: uniq.join("、"),
    count: items.length,
    store: FALLBACK.store,
  };
}

const fill = (t, f) => t.replace(/\{(\w+)\}/g, (m, k) => (k in f ? f[k] : m));

function lessonNumber(items){
  let h = 0;
  const s = items.join("|");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 999983;
  return h % 999 + 1;
}

function compose(items, lesson){
  const f = fields(items);
  return {
    no: lessonNumber(items),
    title: lesson.title, author: lesson.author,
    opening: fill(lesson.opening, f),
    body: lesson.body.map(p => fill(p, f)),
    ending: lesson.ending ? fill(lesson.ending, f) : "",
    questions: lesson.questions.map(q => fill(q, f)),
    items,
  };
}

/* ── 状 态 ── */
const FOODS = ["巨无霸","麦辣鸡腿堡","板烧鸡腿堡","双层吉士堡","麦香鱼",
               "中薯条","麦乐鸡","鸡翅","苹果派","玉米杯",
               "可乐","雪碧","芬达","拿铁","橙汁"];
const picked = new Set(["巨无霸","中薯条","可乐"]);
let lessonIdx = 0;

const $ = id => document.getElementById(id);

/* ── 渲染选择区 ── */
FOODS.forEach(name => {
  const b = document.createElement("button");
  b.className = "chip" + (picked.has(name) ? " on" : "");
  b.textContent = name;
  b.onclick = () => {
    picked.has(name) ? picked.delete(name) : picked.add(name);
    b.classList.toggle("on");
    updPicked();
  };
  $("foods").appendChild(b);
});

LESSONS.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "chip lesson" + (i === 0 ? " on" : "");
  b.textContent = `《${l.title}》`;
  b.onclick = () => {
    lessonIdx = i;
    [...$("lessons").children].forEach((c, j) => c.classList.toggle("on", j === i));
    if ($("lesson").classList.contains("show")) render();
  };
  $("lessons").appendChild(b);
});

function currentItems(){
  const typed = $("custom").value.trim();
  if (typed) return typed.replace(/，/g, ",").split(",").map(s => s.trim()).filter(Boolean);
  return [...picked];
}

function updPicked(){
  const it = currentItems();
  $("picked").textContent = "当前订单：" + (it.length ? it.join("、") : "（还没选，默认给一份巨无霸）");
}

$("custom").addEventListener("input", updPicked);

/* ── 生 成 ── */
function render(){
  let items = currentItems();
  if (!items.length) items = ["巨无霸","中薯条","可乐"];
  const d = compose(items, LESSONS[lessonIdx]);
  $("lesson").innerHTML = `
    <div class="lessno">麦门语文课 · 第 ${String(d.no).padStart(3,"0")} 课</div>
    <div class="title">${d.title}</div>
    <div class="author">${d.author}</div>
    <div class="note">（根据你的订单改编）</div>
    <div class="rule"></div>
    <div class="body">
      <p class="open">${d.opening}</p>
      ${d.body.map(p => `<p>${p}</p>`).join("")}
      ${d.ending ? `<p class="end">${d.ending}</p>` : ""}
    </div>
    <div class="qhead">课 后 习 题</div>
    <div class="qs">${d.questions.map(q => `<p>${q}</p>`).join("")}</div>
    <div class="foot">本课订单：<b>${d.items.join("、")}</b></div>`;
  $("lesson").classList.add("show");
}

function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800);
}

$("go").onclick = render;

$("again").onclick = () => {
  lessonIdx = (lessonIdx + 1) % LESSONS.length;
  [...$("lessons").children].forEach((c, j) => c.classList.toggle("on", j === lessonIdx));
  render();
};

$("copy").onclick = async () => {
  const el = $("lesson");
  if (!el.classList.contains("show")) { toast("先生成一篇吧"); return; }
  const txt = el.innerText.replace(/\n{3,}/g, "\n\n").trim();
  try {
    await navigator.clipboard.writeText(txt);
    toast("已复制，去发给朋友吧");
  } catch {
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("已选中，按 Ctrl/⌘+C 复制");
  }
};

updPicked();
render();
</script>
</body>
</html>
